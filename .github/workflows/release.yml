name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Creates a draft release."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: spotify-agent

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runner so the resulting binary works
          # on older glibc too — building on latest would raise the floor.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Fully static: one binary that runs on any Linux, Alpine included.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite compiles the bundled SQLite amalgamation, so every target
      # needs a C compiler that can produce objects for it.
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Only native targets can run their own tests; the cross-built ones are
      # covered by the CI matrix on their own platforms.
      - name: Smoke test the binary
        if: '!matrix.cross'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/$BIN"
          [ "${{ runner.os }}" = "Windows" ] && BINARY="$BINARY.exe"
          "$BINARY" --version
          "$BINARY" presets >/dev/null
          echo "smoke test passed"

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          STAGE="$BIN-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/$BIN" "$STAGE/"
          cp README.md LICENSE config.example.toml "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          # Checksums are what lets `install.sh` verify what it downloaded.
          if command -v sha256sum >/dev/null; then
            sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          else
            shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$env:BIN-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" $stage
          Copy-Item README.md, LICENSE, config.example.toml $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower() + "  $stage.zip" |
            Out-File -Encoding ascii "$stage.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            spotify-agent-*.tar.gz
            spotify-agent-*.zip
            spotify-agent-*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -lh

      - name: Verify the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CRATE=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$CRATE" ]; then
            echo "tag v$TAG does not match Cargo.toml version $CRATE" >&2
            exit 1
          fi
          echo "version $CRATE matches the tag"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # A manual run produces a draft so it can be inspected before going live.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            **Linux / macOS**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/install.sh | sh
            ```

            **Windows** (normal PowerShell, *not* elevated)
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/install.ps1 | iex
            ```

            Re-running the installer upgrades in place. `SHA256SUMS` covers every
            archive below; the installers verify it automatically.
